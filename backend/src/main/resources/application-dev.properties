# ========================================
# Spring Boot - DEV profil (PostgreSQL)
# ========================================

# Server
server.port=8080

# ========================================
# PostgreSQL konfiguracija
# ========================================

#
#spring.datasource.url=jdbc:postgresql://localhost:5432/db_1
#spring.datasource.username=postgres
#spring.datasource.password=mario
#

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://ep-long-frog-a2mwsxyd-pooler.eu-central-1.aws.neon.tech/neondb?sslmode=require&channelBinding=require

spring.datasource.username=${PG_USER}
spring.datasource.password=${PG_PASSWORD}

# Opcionalno - bolje performanse i pooling
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

#debug
logging.level.org.springframework.security=DEBUG

#slike
spring.web.resources.static-locations=file:uploads/,classpath:/static/

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
